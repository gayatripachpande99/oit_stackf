<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Training | OIT_Stack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=light-theme">
    
    <style>
        body {
            background: #eef1f6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-bottom: 1px solid rgba(10, 25, 47, 0.06) !important;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 86px 24px 24px;
        }

        .training-section {
            width: 100%;
            max-width: 1100px;
            border-radius: 35px;
            overflow: hidden;
            padding: 4.5vh 5vw;
            position: relative;
            background-image: url('assets/service-training-back.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 25px 50px rgba(0,0,0,.15);
        }

        .training-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.1) 0%, rgba(15, 23, 42, 0.35) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .heading {
            text-align: center;
            color: white;
        }

        .heading h1 {
            font-size: clamp(32px, 5vh, 60px);
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.1;
            color: white;
        }

        .heading h1 span {
            color: #2fd3ff;
        }

        .heading p {
            font-size: clamp(16px, 2.2vh, 22px);
            opacity: .9;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 3.5vh;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 2.5vh 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: .3s;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.12), 0 0 15px rgba(0, 191, 255, 0.1);
        }

        .icon {
            width: clamp(50px, 6vh, 70px);
            height: clamp(50px, 6vh, 70px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 2.8vh, 28px);
            flex-shrink: 0;
        }

        .blue {
            background: #dbeafe;
            color: #2563eb;
        }

        .green {
            background: #d1fae5;
            color: #10b981;
        }

        .purple {
            background: #ede9fe;
            color: #7c3aed;
        }

        .gold {
            background: #fef3c7;
            color: #f59e0b;
        }

        .card-content h3 {
            font-size: clamp(16px, 2.2vh, 20px);
            color: #12245d;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .card-content p {
            color: #5b6480;
            font-size: clamp(13px, 1.8vh, 16px);
        }

        .leaderboard {
            width: 370px;
            margin: 2.2vh auto 0;
        }

        .launch-btn {
            display: flex;
            justify-content: center;
            margin-top: 3.5vh;
        }

        .launch-btn button {
            border: none;
            padding: 1.8vh 60px;
            border-radius: 18px;
            cursor: pointer;
            background: linear-gradient(90deg, #5145ff, #18d4ff);
            color: white;
            font-size: clamp(16px, 2.2vh, 20px);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: .3s;
            box-shadow: 0 10px 25px rgba(81, 69, 255, 0.3);
        }

        .launch-btn button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, .25), 0 0 20px rgba(81, 69, 255, 0.4);
        }

        @media(max-width: 1100px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
            .leaderboard {
                margin: 2vh auto 0;
            }
        }

        @media(max-width: 1000px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .heading h1 {
                font-size: 36px;
            }
            .heading p {
                font-size: 18px;
            }
            .leaderboard {
                width: 100%;
            }
        }

        @media(max-width: 640px) {
            main {
                padding: 76px 12px 16px;
            }
            .training-section {
                border-radius: 20px;
                padding: 24px 16px;
            }
            .heading h1 {
                font-size: 28px;
            }
            .card {
                padding: 16px;
                gap: 12px;
                border-radius: 16px;
            }
            .launch-btn button {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 16px;
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- Loader -->
    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo"
                style="display:flex; align-items:center; gap:0.75rem; text-decoration:none;">
                <img src="assets/Logo2.png" alt="OIT_Stack"
                    style="height:45px; width:45px; object-fit:cover; border-radius:50%; box-shadow:0 0 10px rgba(0,191,255,0.5);">
                <div style="display:flex; flex-direction:column; justify-content:center;">
                    <span class="logo-text" style="line-height:1; margin-bottom:2px;">OIT_Stack</span>
                    <span
                        style="font-size:0.65rem; color:var(--text-muted); font-weight:700; letter-spacing:0.5px; text-transform:uppercase;">OnYX
                        Integrated Tech Stack</span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="/training/index.html"> Training Portal</a></li>
            </ul>
            <div class="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="training-section">
            <div class="content">
                <div class="heading">
                    <h1>
                        Ready to Start
                        <span>Training?</span>
                    </h1>
                </div>

                <div class="cards">
                    <div class="card">
                        <div class="icon blue">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </div>
                        <div class="card-content">
                            <h3>Aptitude Tests</h3>
                            <p>Test your analytical skills</p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="icon green">
                            <i class="fa-solid fa-code"></i>
                        </div>
                        <div class="card-content">
                            <h3>Coding Challenges</h3>
                            <p>Solve real-world problems</p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="icon purple">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div class="card-content">
                            <h3>Mock Interviews</h3>
                            <p>Practice & improve confidence</p>
                        </div>
                    </div>
                </div>

                <div class="card leaderboard">
                    <div class="icon gold">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="card-content">
                        <h3>Leaderboard</h3>
                        <p>See how you rank</p>
                    </div>
                </div>

                <div class="launch-btn">
                    <a href="/training/login.html" style="text-decoration: none;">
                        <button type="button">
                            <i class="fa-solid fa-rocket"></i>
                            Launch Training Portal
                        </button>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>

</html>
