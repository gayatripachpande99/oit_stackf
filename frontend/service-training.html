<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Training | OIT_Stack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=light-theme">
    <style>
        body {
            background-image: url('assets/service-training-back.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(10, 25, 47, 0.4) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
        }

        .logo-text {
            color: #ffffff !important;
        }

        header .logo div span:last-child {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        .nav-links li a {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .nav-links li a:not(.btn):hover,
        .nav-links li a.active:not(.btn) {
            color: #00BFFF !important;
        }

        .hamburger i {
            color: #ffffff !important;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cta-card {
            background: rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3) !important;
            border-radius: 24px !important;
            transition: transform 0.4s ease, box-shadow 0.4s ease !important;
        }

        .cta-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 191, 255, 0.2) !important;
        }

        .cta-pill {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .cta-pill:hover {
            background: rgba(255, 255, 255, 0.22) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <!-- Loader -->
    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo"
                style="display:flex; align-items:center; gap:0.75rem; text-decoration:none;">
                <img src="assets/Logo2.png" alt="OIT_Stack"
                    style="height:45px; width:45px; object-fit:cover; border-radius:50%; box-shadow:0 0 10px rgba(0,191,255,0.5);">
                <div style="display:flex; flex-direction:column; justify-content:center;">
                    <span class="logo-text" style="line-height:1; margin-bottom:2px;">OIT_Stack</span>
                    <span
                        style="font-size:0.65rem; color:var(--text-muted); font-weight:700; letter-spacing:0.5px; text-transform:uppercase;">OnYX
                        Integrated Tech Stack</span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
                  <li> <a href="/training/index.html"> Training Portal</a></li>

            </ul>
            <div class="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="min-height: 100vh; padding-top: 120px; padding-bottom: 4rem; display: flex; align-items: center; justify-content: center;">
        <!-- Training Portal CTA -->
        <div class="cta-card" style="width: 100%; max-width: 800px; padding:3.5rem 3rem; text-align:center;">
            <h3 style="color:white; font-size:2.25rem; font-weight:800; margin-bottom:2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.15);">Ready to Start Training?</h3>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; margin-bottom:3rem;">
                <div class="cta-pill" style="display:flex; align-items:center; gap:0.5rem; padding:0.75rem 1.25rem; border-radius:8px; color:white; font-weight:500;">
                    <i class="fa-solid fa-clipboard-list"></i> Aptitude Tests
                </div>
                <div class="cta-pill" style="display:flex; align-items:center; gap:0.5rem; padding:0.75rem 1.25rem; border-radius:8px; color:white; font-weight:500;">
                    <i class="fa-solid fa-code"></i> Coding Challenges
                </div>
                <div class="cta-pill" style="display:flex; align-items:center; gap:0.5rem; padding:0.75rem 1.25rem; border-radius:8px; color:white; font-weight:500;">
                    <i class="fa-solid fa-microphone"></i> Mock Interviews
                </div>
                <div class="cta-pill" style="display:flex; align-items:center; gap:0.5rem; padding:0.75rem 1.25rem; border-radius:8px; color:white; font-weight:500;">
                    <i class="fa-solid fa-trophy"></i> Leaderboard
                </div>
            </div>
            <a href="CorporateTraining/frontend/login.html" class="btn" style="background:white; color:#0f172a; font-weight:700; font-size:1.1rem; padding:1.1rem 3rem; border-radius:14px; display:inline-flex; align-items:center; gap:0.75rem; transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 15px 30px rgba(0,0,0,0.25), 0 0 20px rgba(255,255,255,0.4)'; this.style.background='#f8fafc';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 25px rgba(0, 0, 0, 0.15)'; this.style.background='white';">
                <i class="fa-solid fa-rocket" style="color:#00BFFF;"></i>Launch Training Portal
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
