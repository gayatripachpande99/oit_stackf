<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIT_STACK - Technical MCQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="api.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans overflow-hidden">
    
    <div class="flex h-screen">
        <!-- Main Navigation Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 border-r border-slate-800/60 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
            <div class="h-16 flex items-center justify-between px-5 border-b border-slate-800/60">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                        <i data-lucide="zap" class="w-4 h-4 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white text-sm leading-none">OIT_STACK</h1>
                        <p class="text-[10px] text-slate-500 font-medium mt-0.5">Student Portal</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 py-3 px-3 overflow-y-auto space-y-0.5">
                <a href="student-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> Dashboard
                </a>
                <a href="student-aptitude.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="brain" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> Aptitude Hub
                </a>
                <a href="student-technical.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-blue-500/15 text-blue-400 border border-blue-500/20 group">
                    <i data-lucide="terminal" class="w-4 h-4 shrink-0 text-blue-400"></i> Technical MCQ
                    <span class="ml-auto w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                </a>
                <a href="student-coding.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="code" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> Coding Challenges
                </a>
                <a href="student-interview-setup.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="mic" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> AI Interview
                </a>
                <a href="student-leaderboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="trophy" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> Leaderboard
                </a>
                <a href="student-results.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="clipboard-list" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> My Results
                </a>
                <a href="student-profile.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">
                    <i data-lucide="user" class="w-4 h-4 shrink-0 text-slate-500 group-hover:text-slate-300"></i> Profile
                </a>
            </nav>
        </aside>

        <!-- Test App Layout -->
        <div class="flex-1 lg:ml-64 flex min-w-0 h-full">
            
            <!-- Main Test Section -->
            <div class="flex-1 flex flex-col border-r border-slate-200 bg-slate-50">
                <!-- Header -->
                <div class="bg-white border-b px-6 py-4 flex justify-between items-center shrink-0">
                    <h2 class="font-bold text-xl">Technical MCQ Assessment</h2>
                    <div class="flex items-center gap-2 bg-red-50 px-4 py-2 rounded-lg">
                        <i data-lucide="clock" class="w-5 h-5 text-red-600"></i>
                        <span class="font-bold text-red-600">59:45</span>
                    </div>
                </div>

                <!-- Question Area -->
                <div class="flex-1 p-8 overflow-y-auto bg-slate-50">
                    <div class="mb-4 text-sm text-slate-500" id="questionCounter">
                        Question 1 of 3
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border">
                        <h3 class="text-lg font-semibold mb-6" id="questionText">
                            Loading...
                        </h3>
                        <div class="space-y-4" id="optionsContainer">
                            <!-- Options injected here -->
                        </div>
                    </div>
                </div>

                <!-- Footer Controls -->
                <div class="bg-white border-t p-4 flex justify-between shrink-0">
                    <div class="flex gap-3">
                        <button onclick="prevQuestion()" class="px-4 py-2 border rounded-lg flex items-center gap-2 hover:bg-slate-50 transition">
                            <i data-lucide="chevron-left" class="w-[18px] h-[18px]"></i> Previous
                        </button>
                        <button onclick="clearResponse()" class="px-4 py-2 border rounded-lg flex items-center gap-2 hover:bg-slate-50 transition text-slate-700">
                            <i data-lucide="trash-2" class="w-[18px] h-[18px]"></i> Clear Response
                        </button>
                        <button onclick="toggleReview()" id="reviewBtn" class="px-4 py-2 bg-yellow-500 text-white rounded-lg flex items-center gap-2 hover:bg-yellow-600 transition">
                            <i data-lucide="flag" class="w-[18px] h-[18px]"></i> Mark Review
                        </button>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg flex items-center gap-2 hover:bg-indigo-700 transition">
                            Next <i data-lucide="chevron-right" class="w-[18px] h-[18px]"></i>
                        </button>
                        <button class="px-5 py-2 bg-green-600 text-white rounded-lg flex items-center gap-2 hover:bg-green-700 transition">
                            <i data-lucide="check-circle" class="w-[18px] h-[18px]"></i> Submit Test
                        </button>
                    </div>
                </div>
            </div>

            <!-- Question Palette -->
            <div class="w-80 bg-white p-5 shrink-0 overflow-y-auto border-l">
                <h3 class="font-bold mb-4">Question Palette</h3>
                
                <!-- Legend -->
                <div class="space-y-2 mb-6 text-sm">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-green-500 rounded"></div> Answered
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-purple-500 rounded"></div> Review
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-slate-300 rounded"></div> Not Answered
                    </div>
                </div>

                <div class="grid grid-cols-5 gap-3" id="paletteGrid">
                    <!-- Buttons injected here -->
                </div>

                <div class="mt-8">
                    <h4 class="font-semibold mb-3">Progress</h4>
                    <div class="w-full bg-slate-200 rounded-full h-3">
                        <div id="progressBar" class="bg-green-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <p class="text-sm text-slate-500 mt-2" id="progressText">
                        0 / 3 Answered
                    </p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                question: "What is the time complexity of Binary Search?",
                options: ["O(n)", "O(log n)", "O(n log n)", "O(1)"]
            },
            {
                id: 2,
                question: "Which protocol is used for email?",
                options: ["HTTP", "SMTP", "FTP", "TCP"]
            },
            {
                id: 3,
                question: "What is encapsulation?",
                options: [
                "Data hiding",
                "Inheritance",
                "Polymorphism",
                "Abstraction"
                ]
            }
        ];

        let currentQuestion = 0;
        let answers = {};
        let review = [];

        function render() {
            // Update Question counter
            document.getElementById('questionCounter').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            
            // Update Question Text
            document.getElementById('questionText').innerText = questions[currentQuestion].question;

            // Render Options
            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';
            
            questions[currentQuestion].options.forEach((option, index) => {
                const isSelected = answers[currentQuestion] === index;
                const cssClass = isSelected 
                    ? 'border-indigo-500 bg-indigo-50' 
                    : 'hover:bg-slate-50 border-slate-200';
                
                optsContainer.innerHTML += `
                    <label class="flex items-center gap-3 p-4 rounded-lg border cursor-pointer transition ${cssClass}">
                        <input type="radio" name="option" class="w-4 h-4 text-indigo-600" ${isSelected ? 'checked' : ''} onchange="handleAnswer(${index})">
                        <span class="text-slate-700">${option}</span>
                    </label>
                `;
            });

            // Update Palette
            const paletteGrid = document.getElementById('paletteGrid');
            paletteGrid.innerHTML = '';
            
            questions.forEach((q, index) => {
                let colorClass = "bg-slate-200 text-slate-700";
                
                if (answers[index] !== undefined) colorClass = "bg-green-500 text-white";
                if (review.includes(index)) colorClass = "bg-purple-500 text-white";
                if (currentQuestion === index) colorClass = "bg-indigo-600 text-white ring-2 ring-indigo-300";

                paletteGrid.innerHTML += `
                    <button onclick="gotoQuestion(${index})" class="h-12 rounded-lg font-semibold transition-all ${colorClass}">
                        ${index + 1}
                    </button>
                `;
            });

            // Update Progress
            const answeredCount = Object.keys(answers).length;
            const progressPct = (answeredCount / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;
            document.getElementById('progressText').innerText = `${answeredCount} / ${questions.length} Answered`;

            // Update Review Button State
            const reviewBtn = document.getElementById('reviewBtn');
            if (review.includes(currentQuestion)) {
                reviewBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                reviewBtn.classList.add('bg-purple-500', 'hover:bg-purple-600');
                reviewBtn.innerHTML = '<i data-lucide="flag-off" class="w-[18px] h-[18px]"></i> Unmark Review';
            } else {
                reviewBtn.classList.remove('bg-purple-500', 'hover:bg-purple-600');
                reviewBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                reviewBtn.innerHTML = '<i data-lucide="flag" class="w-[18px] h-[18px]"></i> Mark Review';
            }

            lucide.createIcons();
        }

        function handleAnswer(index) {
            answers[currentQuestion] = index;
            render();
        }

        function clearResponse() {
            delete answers[currentQuestion];
            render();
        }

        function toggleReview() {
            const idx = review.indexOf(currentQuestion);
            if (idx > -1) {
                review.splice(idx, 1);
            } else {
                review.push(currentQuestion);
            }
            render();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                render();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                render();
            }
        }

        function gotoQuestion(index) {
            currentQuestion = index;
            render();
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
