<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIT_STACK - Technical MCQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        let questions = [];
        let currentQuestion = 0;
        let answers = {};
        let review = [];
        let testData = null;
        let resultId = null;
        let testId = null;
        let timeLeft = 0;
        let timerInterval = null;
        let startTime = Date.now();

        async function initTest() {
            if (!api.getToken()) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Fetch all tests to find a technical one
                const testsRes = await api.request('/tests');
                const allTests = testsRes.data || [];
                
                // Find a technical test
                let targetTest = allTests.find(t => t.category && (t.category.name.toLowerCase().includes('tech') || t.category.name.toLowerCase().includes('mcq')));
                
                // Fallback to any test if no technical test found
                if (!targetTest && allTests.length > 0) {
                    targetTest = allTests[0];
                }

                if (!targetTest) {
                    document.getElementById('questionText').innerText = "No technical tests available at the moment.";
                    return;
                }

                testId = targetTest._id;
                
                // Start the test to get questions
                const startRes = await api.request(`/tests/${testId}/start`, { method: 'POST' });
                testData = startRes.data.test || startRes.data;
                resultId = startRes.data.resultId || null;
                
                // Ensure questions array is populated
                questions = testData.questions || [];
                if (questions.length === 0) {
                    document.getElementById('questionText').innerText = "This test has no questions.";
                    return;
                }

                timeLeft = (testData.totalTime || 30) * 60;
                
                // Setup timer
                startTimer();
                
                // Initial render
                render();
            } catch (error) {
                console.error("Failed to load test:", error);
                document.getElementById('questionText').innerText = "Error loading test. Please try again later.";
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitTest(true);
                    return;
                }
                timeLeft--;
                
                const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const secs = (timeLeft % 60).toString().padStart(2, '0');
                
                const timerSpan = document.querySelector('.text-red-600.font-bold');
                if (timerSpan) timerSpan.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function render() {
            if (questions.length === 0) return;

            // Update Question counter
            document.getElementById('questionCounter').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            
            // Update Question Text
            document.getElementById('questionText').innerText = questions[currentQuestion].question;

            // Render Options
            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';
            
            questions[currentQuestion].options.forEach((option, index) => {
                const isSelected = answers[currentQuestion] === index;
                const cssClass = isSelected 
                    ? 'border-indigo-500 bg-indigo-50' 
                    : 'hover:bg-slate-50 border-slate-200';
                
                optsContainer.innerHTML += `
                    <label class="flex items-center gap-3 p-4 rounded-lg border cursor-pointer transition ${cssClass}">
                        <input type="radio" name="option" class="w-4 h-4 text-indigo-600" ${isSelected ? 'checked' : ''} onchange="handleAnswer(${index})">
                        <span class="text-slate-700 font-medium">${option}</span>
                    </label>
                `;
            });

            // Update Palette
            const paletteGrid = document.getElementById('paletteGrid');
            paletteGrid.innerHTML = '';
            
            questions.forEach((q, index) => {
                let colorClass = "bg-slate-200 text-slate-700 hover:bg-slate-300";
                
                if (answers[index] !== undefined) colorClass = "bg-green-500 text-white hover:bg-green-600";
                if (review.includes(index)) colorClass = "bg-purple-500 text-white hover:bg-purple-600";
                if (currentQuestion === index) colorClass = "bg-indigo-600 text-white ring-2 ring-indigo-300";

                paletteGrid.innerHTML += `
                    <button onclick="gotoQuestion(${index})" class="h-12 rounded-lg font-semibold transition-all ${colorClass}">
                        ${index + 1}
                    </button>
                `;
            });

            // Update Progress
            const answeredCount = Object.keys(answers).length;
            const progressPct = (answeredCount / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;
            document.getElementById('progressText').innerText = `${answeredCount} / ${questions.length} Answered`;

            // Update Review Button State
            const reviewBtn = document.getElementById('reviewBtn');
            if (review.includes(currentQuestion)) {
                reviewBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                reviewBtn.classList.add('bg-purple-500', 'hover:bg-purple-600');
                reviewBtn.innerHTML = '<i data-lucide="flag-off" class="w-[18px] h-[18px]"></i> Unmark Review';
            } else {
                reviewBtn.classList.remove('bg-purple-500', 'hover:bg-purple-600');
                reviewBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                reviewBtn.innerHTML = '<i data-lucide="flag" class="w-[18px] h-[18px]"></i> Mark Review';
            }

            lucide.createIcons();
        }

        async function handleAnswer(index) {
            answers[currentQuestion] = index;
            
            // Background save to API
            if (resultId && questions[currentQuestion]) {
                const qId = questions[currentQuestion]._id;
                api.request(`/results/${resultId}/answer`, {
                    method: 'PUT',
                    body: JSON.stringify({ questionId: qId, selectedAnswer: index, timeTaken: 0 })
                }).catch(() => {});
            }

            render();
        }

        function clearResponse() {
            delete answers[currentQuestion];
            render();
        }

        function toggleReview() {
            const idx = review.indexOf(currentQuestion);
            if (idx > -1) {
                review.splice(idx, 1);
            } else {
                review.push(currentQuestion);
            }
            render();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                render();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                render();
            }
        }

        function gotoQuestion(index) {
            currentQuestion = index;
            render();
        }

        async function submitTest(isAuto = false) {
            if (!testId) return;
            
            if (!isAuto) {
                const confirmSubmit = confirm("Are you sure you want to submit the test?");
                if (!confirmSubmit) return;
            }

            clearInterval(timerInterval);
            const totalTimeElapsed = Math.round((Date.now() - startTime) / 1000);

            // Format answers for API
            const payloadAnswers = questions.map((q, idx) => ({
                question: q._id,
                selectedAnswer: answers[idx] !== undefined ? answers[idx] : null,
                timeTaken: 0
            }));

            try {
                await api.request(`/tests/${testId}/submit`, {
                    method: 'POST',
                    body: JSON.stringify({
                        resultId,
                        answers: payloadAnswers,
                        timeTaken: totalTimeElapsed,
                        autoSubmitted: isAuto
                    })
                });
                
                alert('Test submitted successfully!');
                window.location.href = 'student-dashboard.html';
            } catch (err) {
                console.error('Error submitting test:', err);
                alert(err.message || 'Error submitting test');
            }
        }

        // Attach submit function to button
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.querySelector('button.bg-green-600');
            if (submitBtn) {
                submitBtn.onclick = () => submitTest(false);
            }
            initTest();
        });
    </script>
</body>
</html>
