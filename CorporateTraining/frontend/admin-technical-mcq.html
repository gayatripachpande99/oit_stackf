<head>
    <meta charset="UTF-8">

    <title>Admin - Technical MCQs</title>
                </main>
                    </main>
        <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="api.js?v=2"></script>
</head>
<body class="bg-slate-50 dark:bg-[#0a0f1e] text-slate-900 dark:text-white font-sans overflow-hidden">

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 dark:bg-[#0d1117] border-r border-slate-800/60 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">

                    </div>
                    <div>

                        <p class="text-[10px] text-slate-500 font-medium mt-0.5">Admin Portal</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 py-3 px-3 overflow-y-auto space-y-0.5">
                <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 group">

                <a href="admin-dashboard.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i> Dashboard
                </a>
                <a href="admin-students.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="users" class="w-4 h-4 shrink-0"></i> Students
                </a>
                <a href="admin-categories.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="folder-tree" class="w-4 h-4 shrink-0"></i> Categories
                </a>
                <a href="admin-questions.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="database" class="w-4 h-4 shrink-0"></i> Question Pool
                </a>
                <a href="admin-technical-mcq.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="terminal" class="w-4 h-4 shrink-0"></i> Technical MCQs
                </a>
                <a href="admin-tests.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="file-text" class="w-4 h-4 shrink-0"></i> Tests
                </a>
                <a href="admin-coding.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="code" class="w-4 h-4 shrink-0"></i> Coding Challenges
                </a>
                <a href="admin-interviews.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="mic" class="w-4 h-4 shrink-0"></i> Mock Interviews
                </a>
                <a href="admin-results.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="award" class="w-4 h-4 shrink-0"></i> Results
                </a>
                <a href="admin-analytics.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                    <i data-lucide="bar-chart-3" class="w-4 h-4 shrink-0"></i> Analytics
                </a>
            </nav>
            <div class="p-3 border-t border-slate-800/60">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 p-2.5 rounded-xl bg-slate-800/50 hover:bg-slate-800 border border-slate-700/40 text-slate-400 hover:text-rose-400 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span class="text-sm font-medium">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Overlay for mobile sidebar -->
        <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden lg:hidden"></div>

        <!-- Main Content -->
        <div class="flex-1 lg:ml-64 flex flex-col min-w-0 h-full">
            <header class="min-h-[4.5rem] py-3 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800/60 flex flex-col md:flex-row md:items-center justify-between px-4 lg:px-6 shrink-0 z-20 gap-4">
                <div class="flex items-center gap-3 flex-1">
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="menu" class="w-5 h-5 text-slate-600 dark:text-slate-400"></i>
                    </button>
                    <div class="flex-1 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                                <i data-lucide="terminal" class="w-7 h-7 text-indigo-500"></i>
                                Technical Core MCQs
                            </h1>
                            <p class="text-sm text-slate-400 mt-0.5" id="qCount">Loading questions...</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="window.location.href='admin-technical-mcq-create.html'" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-500/20 transition-all flex items-center gap-2">
                                <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Technical MCQ
                            </button>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <a href="/" class="text-sm font-bold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors mr-2">Home</a>
                    <button onclick="toggleTheme()" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 lg:p-6 bg-slate-50/50 dark:bg-[#0a0f1e]/50">

                <div class="max-w-6xl mx-auto flex flex-col gap-6 pb-12">
                    
                    

                    <!-- Filters -->
                    <div class="p-4 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
                        <div class="relative w-full sm:w-1/3">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="searchInput" placeholder="Search technical questions..." class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <select id="catFilter" class="w-full sm:w-48 px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                                <option value="">All Technical Categories</option>
                            </select>
                            <select id="diffFilter" class="w-full sm:w-40 px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                                <option value="">All Difficulties</option>
                                <option value="easy">Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                    </div>

                    <div id="loader" class="flex justify-center py-12">
                        <div class="animate-spin h-8 w-8 border-4 border-indigo-500 border-t-transparent rounded-full"></div>
                    </div>

                    <!-- Main Table -->
                    <div id="tableContainer" class="hidden w-full overflow-x-auto rounded-3xl border border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-800 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider text-xs">
                                    <th class="px-6 py-4 w-[40%]">Question Text</th>
                                    <th class="px-6 py-4">Category</th>
                                    <th class="px-6 py-4">Difficulty</th>
                                    <th class="px-6 py-4">Marks</th>
                                    <th class="px-6 py-4">Status</th>
                                    <th class="px-6 py-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-semibold text-slate-700 dark:text-slate-200">
                                <!-- Dynamic JS Injection -->
                            </tbody>
                        </table>
                        <div id="emptyState" class="hidden py-12 flex-col items-center justify-center text-center">
                            <i data-lucide="alert-circle" class="w-12 h-12 text-slate-300 mb-3"></i>
                            <p class="text-slate-500 text-sm">No technical questions match filters.</p>
                        </div>
                    </div>

                </div>
            </main>
        <script>
        lucide.createIcons();

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            const overlay = document.getElementById('sidebarOverlay');
            if(overlay) overlay.classList.toggle('hidden');
        }

        function logout() {
            api.removeToken();
            window.location.href = 'login.html';
        }

        let allQuestions = [];
        let technicalCategories = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const token = api.getToken();
            if(!token) { window.location.href='login.html'; return; }
            
            try {
                // Fetch ONLY technical categories
                const catRes = await api.request('/categories?type=technical');
                technicalCategories = catRes.data || [];
                
                const catFilter = document.getElementById('catFilter');
                technicalCategories.forEach(c => {
                    catFilter.innerHTML += `<option value="${c._id}">${c.name}</option>`;
                });

                await fetchQuestions();
                
                document.getElementById('searchInput').addEventListener('input', applyFilters);
                document.getElementById('catFilter').addEventListener('change', applyFilters);
                document.getElementById('diffFilter').addEventListener('change', applyFilters);

            } catch(e) {
                console.error(e);
            }
        });

        async function fetchQuestions() {
            document.getElementById('loader')?.classList.remove('hidden');
            document.getElementById('tableContainer')?.classList.add('hidden');
            try {
                // Fetch only active questions
                const res = await api.request('/questions?limit=1000');
                const rawList = (res.data.questions || []).filter(q => q.isActive !== false);
                
                // Keep only those with category.type === 'technical'
                allQuestions = rawList.filter(q => q.category?.type === 'technical');
                applyFilters();
            } catch(e) {
                console.error(e);
                alert("Error loading technical questions");
            } finally {
                document.getElementById('loader')?.classList.add('hidden');
                document.getElementById('tableContainer')?.classList.remove('hidden');
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('catFilter').value;
            const diff = document.getElementById('diffFilter').value;

            const filtered = allQuestions.filter(q => {
                let match = true;
                if(search && !q.question.toLowerCase().includes(search)) match = false;
                if(cat && q.category?._id !== cat) match = false;
                if(diff && q.difficulty !== diff) match = false;
                return match;
            });

            document.getElementById('qCount').textContent = `${filtered.length} technical MCQs found`;
            
            const tbody = document.getElementById('tableBody');
            const empty = document.getElementById('emptyState');

            if(filtered.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
            } else {
                empty.classList.add('hidden');
                empty.classList.remove('flex');
                tbody.innerHTML = filtered.map(q => {
                    let diffBadge = '';
                    if(q.difficulty==='easy') diffBadge='bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400';
                    if(q.difficulty==='medium') diffBadge='bg-amber-100 text-amber-600 dark:bg-amber-500/20 dark:text-amber-400';
                    if(q.difficulty==='hard') diffBadge='bg-rose-100 text-rose-600 dark:bg-rose-500/20 dark:text-rose-400';

                    let statusBadge = q.isActive ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400' : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400';

                    return `
                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 transition-all">
                        <td class="px-6 py-4">
                            <p class="text-xs font-bold truncate max-w-[300px]" title="${q.question.replace(/"/g, '&quot;')}">${q.question}</p>
                        </td>
                        <td class="px-6 py-4 text-xs font-medium text-slate-500 dark:text-slate-400">
                            ${q.category?.name || 'Technical'}
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${diffBadge}">${q.difficulty}</span>
                        </td>
                        <td class="px-6 py-4 text-slate-600 dark:text-slate-300">
                            ${q.marks} marks
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${statusBadge}">${q.isActive ? 'Active' : 'Deleted'}</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="window.location.href='admin-technical-mcq-create.html?id=${q._id}'" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors inline-block mr-1">
                                <i data-lucide="edit-2" class="w-4 h-4 text-slate-500"></i>
                            </button>
                            ${q.isActive ? `<button onclick="deleteQuestion('${q._id}')" class="p-1.5 rounded-lg border border-rose-200 dark:border-rose-900/50 hover:bg-rose-50 dark:hover:bg-rose-900/20 transition-colors inline-block">
                                <i data-lucide="trash-2" class="w-4 h-4 text-rose-500"></i>
                            </button>` : ''}
                        </td>
                    </tr>
                    `
                }).join('');
                lucide.createIcons();
            }
        }

        async function deleteQuestion(id) {
            if(confirm('Are you sure you want to soft-delete this question?')) {
                try {
                    await api.request(`/questions/${id}`, { method: 'DELETE' });
                    fetchQuestions();
                } catch(e) {
                    alert(e.message);
                }
            }
        }
    </script>
</body>
</html>
